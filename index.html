<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UlpoMedia</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/main.js" defer></script>

   
</head>

<body>

   <header class="main-header">
        <nav class="nav-bar">
            <a href="#" class="brand-logo">DANA 2</a>
            <div class="nav-menu">
                <a href="#trailer-iframe">Trailer</a>
                <a href="#features">Features</a>
                <a href="#gallery">Multimedia</a>
            </div>
        </nav>
   </header> 
   
    <main>
        <!-- Hero Section -->
        <section class="hero">

            <div class="trailer-block">
                <div class="trailer-frame">
                    <!-- Starts muted so autoplay is allowed; the gate below unmutes on click -->
                    <iframe
                        id="trailer-iframe"
                        src=https://www.youtube.com/embed/isPH5q84l7U?si=1_efWORRhOpNmluK?autoplay=1&mute=1&loop=1
                        title="Dana: The Cyber Relic — Trailer"
                        allow="autoplay; encrypted-media; picture-in-picture"
                        allowfullscreen>
                    </iframe>
                </div>

                <a class="steam-btn" href="https://store.steampowered.com/app/YOUR_APP_ID" target="_blank" rel="noopener">
                    <img src="https://cdn.simpleicons.org/steam/ffffff" alt="">
                    Wishlist on Steam!
                </a>
            </div>

        </section>

        <!-- Wave divider -->
        <div class="wave-divider">
            <svg viewBox="0 0 1200 80" preserveAspectRatio="none" style="display:block; width:100%; height:100%;">
                <path d="M0,80 L0,40 C300,80 600,0 900,40 C1050,60 1150,20 1200,40 L1200,80 Z" fill="var(--accent-dark)"/>
            </svg>
        </div>

        <!-- Features Section -->
        <section id="features">
            <div class="feature-highlight">
                <div class="feature-text">
                    <p class="feature-description">
                        Dana 2 The Cyber Relic es un plataformero 3D en el que Dana consigue reliquias y pelea contra Bolseros!
                    </p>
                </div>

                <!-- Carousel -->
                <div class="carousel">

                    <button class="carousel-button prev">‹</button>

                    <div class="carousel-window">
                        <div class="carousel-track">

                            <article class="carousel-item">
                                <img src="./assets/carousel-items/item-dana-idle.png" alt="">
                            </article>

                            <article class="carousel-item active">
                                <img src="./assets/carousel-items/item-dana-jump-to-plataform.png" alt="">
                            </article>

                            <article class="carousel-item">
                                <img src="./assets/carousel-items/item-dana-attacking.png" alt="">
                            </article>

                        </div>
                    </div>

                    <button class="carousel-button next">›</button>

                    <div class="carousel-dots">
                        <span class="dot"></span>
                        <span class="dot active"></span>
                        <span class="dot"></span>
                    </div>

                </div>
            </div>
        </section>

        <!-- Gallery Section -->
        <section id="gallery">
            <div class="gallery-header">
                <h2 class="gallery-title">Multimedia</h2>

                <!-- Assign the .zip file route with the presskit -->
                <a class="presskit-btn" href="./assets/press-kit/DANA2TheCyberRelic-Press-Kit.zip" download>
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    Download Press Kit
                </a>
            </div>

            <div class="gallery-grid" id="gallery-grid">
                <figure class="gallery-item"><img src="./assets/media/bg.webp" alt=""></figure>
                <figure class="gallery-item"><img src="./assets/media/bg.webp" alt=""></figure>
                <figure class="gallery-item"><img src="./assets/media/bg.webp" alt=""></figure>
                <figure class="gallery-item"><img src="./assets/media/bg.webp" alt=""></figure>
                <figure class="gallery-item"><img src="./assets/media/bg.webp" alt=""></figure>
                <figure class="gallery-item"><img src="./assets/media/bg.webp" alt=""></figure>
            </div>

            <button class="gallery-toggle" id="gallery-toggle" type="button">Show More</button>
        </section>

        <!-- Contact Section (social media) -->
        <section id="contact">
            <!-- Social media (instagram, twt, web) for news-->
        </section>
    </main>

</body>

</html>
